<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="../../assets/pata-de-cachorro.png">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <title>Mania de Bicho | Login</title>
</head>

<body>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <main class="container">
        <section class="card-login" aria-labelledby="loginTitle">
            <div class="brand-card">
                <img class="pata lateral" src="../../assets/pata-de-cachorro.png" alt="">
                <div class="brand-text">
                    <h1 id="loginTitle" class="titulo-login">Mania de Bicho</h1>
                    <p class="service-tag">Pet Shop - Banho e Tosa</p>
                </div>
                <img class="pata lateral" src="../../assets/icons8-pegada-de-gato-64.png" alt="">
            </div>

            <p class="subtitulo-login">LOGIN RESTRITO PARA ADM'S</p>

            <form id="loginForm">
                <label for="email">E-MAIL</label>
                <input id="email" name="email" type="email" placeholder="email@email.com" required>

                <label for="senha">SENHA</label>
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha..." required>

                <div class="botao">
                    <button class="botao-login" type="submit">ENTRAR</button>
                </div>

                <div class="footer-card">
                    <p>Nao tem uma conta cadastrada? <strong><a href="../cadastro/cadastro.html">Crie uma conta</a></strong></p>
                </div>
            </form>
        </section>
    </main>

    <script src="login.js"></script>
</body>

</html>
